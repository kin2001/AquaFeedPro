name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/backend-improvement
      - feat/backend-t04-metrics

permissions:
  contents: read

jobs:
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: node scripts/check-notification-controller.mjs
      - run: node scripts/check-alerts.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:manual-feed

  backend-baseline:
    name: backend-baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: aquafeed_backend_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aquafeed_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Push sender and notification routes (offline mocks only)
        run: |
          node supabase/tests/art96_push_sender_check.mjs
          node supabase/tests/art95_api_route_check.mjs
          node supabase/functions/_shared/telemetry.test.ts
          node supabase/tests/backend_metric_route_check.mjs
      - name: Shared metadata runner (offline mocks only)
        run: node --test supabase/tests/check-shared-backend-metadata.test.mjs
      - name: Runner guards and real isolated assertion failure
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:54322/aquafeed_backend_test
        run: node --test supabase/tests/check-backend-baseline.test.mjs supabase/tests/backend_lock_order.test.mjs supabase/tests/backend_push_regression.test.mjs supabase/tests/backend_metric_regression.test.mjs supabase/tests/backend_metric_acl_regression.test.mjs supabase/tests/backend_public_types.test.mjs
      - name: Supabase prerequisites, immutable migrations and plain rollback SQL suites
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:54322/aquafeed_backend_test
        run: node supabase/scripts/check-backend-baseline.mjs --database-url-env LOCAL_TEST_DATABASE_URL
      - name: Push uncertain-send OLD RED / forward GREEN (disposable only)
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:54322/aquafeed_backend_test
        run: node supabase/tests/backend_push_regression.mjs --database-url-env LOCAL_TEST_DATABASE_URL
      - name: Generate public-only schema types (initial reviewed artifact; expected committed diff)
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:54322/aquafeed_backend_test
        run: node supabase/scripts/generate-backend-public-types.mjs
      - name: Retain public types and sanitized generation provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, parent verified
        with:
          name: t04-public-types
          path: |
            ${{ runner.temp }}/t04-public-types/database.types.ts
            ${{ runner.temp }}/t04-public-types/provenance.json
            ${{ runner.temp }}/t04-public-types/committed.diff
          retention-days: 14
          if-no-files-found: error

  simulator:
    name: simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python supabase/scripts/art31_simulator.py --self-test
      - run: python supabase/scripts/art31_simulator.py --self-test-art33
      - run: python supabase/scripts/art31_simulator.py --self-test-telemetry
      - run: python supabase/tests/backend_metric_simulator_check.py
      - run: python supabase/scripts/art31_simulator.py --self-test-alerts

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run validate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
